name: Deploy to Vercel

on:
  push:
    branches:
      - claude/java-project-frontend-backend-MKf2S
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_kFv2OMpSyY3EwEiMOF5zXTXA
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (auto-create project)
        run: |
          vercel deploy \
            --token="$VERCEL_TOKEN" \
            --yes \
            --prod \
            --name=crud-usuarios-tecsup \
            2>&1 | tee deploy.log
          grep -E "https://|Error|error" deploy.log || true
