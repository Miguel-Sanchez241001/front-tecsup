name: Deploy to Vercel

on:
  push:
    branches:
      - claude/java-project-frontend-backend-MKf2S
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_kFv2OMpSyY3EwEiMOF5zXTXA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel token
        run: |
          echo "Testing token against Vercel API..."
          STATUS=$(curl -s -o /tmp/vercel_test.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            https://api.vercel.com/v2/user)
          echo "HTTP Status: $STATUS"
          cat /tmp/vercel_test.json
          if [ "$STATUS" != "200" ]; then
            echo "❌ Token is invalid or rejected (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Token is valid"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          set -e
          vercel deploy \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes \
            --prod \
            --name=crud-usuarios-tecsup \
            --debug \
            2>&1
