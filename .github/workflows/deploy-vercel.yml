name: Deploy to Vercel

on:
  push:
    branches:
      - claude/java-project-frontend-backend-MKf2S
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        id: deploy
        run: |
          npm i -g vercel
          URL=$(vercel deploy --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=miguel-sanchezs-projects-db8a19da \
            --yes \
            --prod 2>&1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
